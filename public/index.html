<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CHIMERA</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.2/cytoscape.min.js"></script>
  </head>
  <body>
    <aside class="side">
      <div class="brand">▲ CHIMERA</div>
      <nav id="nav">
        <small>MONITOR</small>
        <a href="#overview">Overview</a>
        <small>INVESTIGATE</small>
        <a href="#investigations">Investigations</a>
        <a href="#graph">Attack graph</a>
        <a href="#timeline">Event timeline</a>
        <small>DATA</small>
        <a href="#logs">Security logs</a>
        <a href="#reports">Reports</a>
      </nav>
      <div class="sys" id="sys"></div>
    </aside>
    <main>
      <header class="top">
        <div id="crumb"></div>
        <div class="actions">
          <span id="badge" class="badge warn"></span>
          <label class="btn"
            >Upload logs<input type="file" id="up" accept=".csv" hidden
          /></label>
          <button class="btn ghost" id="reset">Use sample data</button>
        </div>
      </header>
      <section id="page"></section>
    </main>
    <aside class="drawer" id="ev"></aside>
    <script src="app.js"></script>
    <script src="pages/overview.js"></script>
    <script src="pages/investigations.js"></script>
    <script src="pages/graph.js"></script>
    <script src="pages/timeline.js"></script>
    <script src="pages/logs.js"></script>
    <script src="pages/reports.js"></script>
  </body>
</html>
